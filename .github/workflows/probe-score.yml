name: probe-score

# Scores a probe (docs/plans/2026-11-24-probe-loop.md) once every review loop on it has
# finished: opens the planter's sealed answer key, checks it against the hash the planter
# recorded on the planted commit, collects what each loop left on the pull request at the planted
# commit, and posts one verdict per loop (bin/probe-score). Then it closes the probe.
#
# Run by hand: Actions > probe-score > Run workflow, with the probe's pull request and the
# planter run that holds the key. Only a pull request labelled hold, with a provenance status
# on one of its commits, is scored or closed.
# It runs this repository's own scripts from the default branch, never the probe's code.
#
# Setup: a repository secret PROBE_KEY, the planter's sealing secret. No other workflow may
# name it (bin/agent-allowlists.test.sh checks every agent workflow).

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "The probe's pull request number"
        required: true
        type: string
      key_run:
        description: "The planter run id whose probe-key artifact holds the sealed key"
        required: true
        type: string
      close:
        description: "Close the probe's pull request after scoring"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: probe-score-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ inputs.pr }}
      KEY_RUN: ${{ inputs.key_run }}
      # W, the work folder, is set in the first step: GitHub refuses the runner context here.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the inputs, and that the pull request is on hold
        run: |
          set -u
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a number"; exit 1; }
          [[ "$KEY_RUN" =~ ^[0-9]+$ ]] || { echo "::error::key_run must be a run id"; exit 1; }
          labels="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')"
          printf '%s\n' "$labels" | grep -qx hold || { echo "::error::#$PR is not labelled hold; nothing is scored or closed"; exit 1; }
          W="$RUNNER_TEMP/probe"
          echo "W=$RUNNER_TEMP/probe" >> "$GITHUB_ENV"
          mkdir -p "$W"

      - name: Fetch the sealed key
        run: gh run download "$KEY_RUN" --repo "$GITHUB_REPOSITORY" --name probe-key --dir "$W/sealed"

      - name: Check the key against the hash on the planted commit, and open it
        env:
          PROBE_KEY: ${{ secrets.PROBE_KEY }}
        run: |
          set -u
          # The planter recorded "sha256:<64 hex>" as the provenance commit status on the
          # planted commit before opening the pull request, where no review agent reads; the
          # earliest such status counts. A key that does not match it, or that names another
          # commit, is not used.
          want=""; planted=""
          for c in $(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits?per_page=100" --jq '.[].sha'); do
            d="$(gh api "repos/$GITHUB_REPOSITORY/commits/$c/statuses?per_page=100" \
              --jq '[.[] | select(.context == "provenance")] | last | .description // empty')"
            if [ -n "$d" ]; then want="${d#sha256:}"; planted="$c"; break; fi
          done
          [[ "$want" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::#$PR has no provenance status on any commit"; exit 1; }
          bash bin/probe-key check "$W/sealed/key.sealed" "$want"
          bash bin/probe-key open "$W/sealed/key.sealed" > "$W/key.json"
          # The key names the commit it was planted in, and the planter could not know the
          # pull request's number: check the one and add the other.
          python3 -I -c '
          import json, sys
          path, planted, pr = sys.argv[1], sys.argv[2], int(sys.argv[3])
          k = json.load(open(path))
          if k.get("planted_sha") != planted:
              sys.exit("the key names " + str(k.get("planted_sha")) + ", the status is on " + planted)
          k["pr"] = pr
          json.dump(k, open(path, "w"), indent=1)
          ' "$W/key.json" "$planted" "$PR"

      - name: Collect the evidence at the planted commit
        run: |
          set -u
          sha="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["planted_sha"])' "$W/key.json")"
          python3 -I bin/probe-evidence "$PR" --repo "$GITHUB_REPOSITORY" --sha "$sha" > "$W/evidence.json"

      - name: Score
        run: |
          set -u
          python3 -I bin/probe-score "$W/key.json" "$W/evidence.json" > "$W/rows.jsonl"
          python3 -I bin/probe-score --markdown "$W/key.json" "$W/evidence.json" > "$W/score.md"
          cat "$W/score.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the key, the evidence and the rows
        uses: actions/upload-artifact@v7
        with:
          name: probe-score-${{ inputs.pr }}
          path: |
            ${{ runner.temp }}/probe/key.json
            ${{ runner.temp }}/probe/evidence.json
            ${{ runner.temp }}/probe/rows.jsonl
          retention-days: 90

      - name: Post the scores on the probe
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$W/score.md"

      - name: Keep the scores in the store
        # The probe ledger (docs/plans/2026-11-24-probe-loop.md, Store): insert-only, with the
        # publishable key, which may add rows and nothing else (store/schema.sql). A refusal shows
        # on the run but does not stop the probe being closed.
        continue-on-error: true
        env:
          AGENT_TRANSCRIPTS_URL: ${{ secrets.AGENT_TRANSCRIPTS_URL }}
          AGENT_TRANSCRIPTS_INSERT_KEY: ${{ secrets.AGENT_TRANSCRIPTS_INSERT_KEY }}
        run: |
          set -u
          if [ -z "$AGENT_TRANSCRIPTS_URL" ] || [ -z "$AGENT_TRANSCRIPTS_INSERT_KEY" ]; then
            echo "::warning::the AGENT_TRANSCRIPTS_URL and AGENT_TRANSCRIPTS_INSERT_KEY secrets are not both set: the scores are not stored"; exit 0
          fi
          python3 -I bin/probe-store "$W/key.json" "$W/rows.jsonl" --scorer-run "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

      - name: Close the probe
        if: inputs.close
        run: gh pr close "$PR" --repo "$GITHUB_REPOSITORY" --comment "Scored by probe-score (run $GITHUB_RUN_ID); probes are never merged."
