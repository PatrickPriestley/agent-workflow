name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Native evaluation context
        run: node --test evals/context.test.cjs
      - name: Installer
        run: bash install.test.sh
      - name: commit-gate
        run: bash bin/commit-gate.test.sh
      - name: agent-review
        run: bash bin/agent-review.test.sh
      - name: plan skill scripts
        run: for t in skills/plan/scripts/test-*.sh; do bash "$t"; done

  pr-title:
    name: conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Squash merges use the PR title as the commit subject, so it must pass the same rule
          # as commit-gate's commit-msg hook.
          if printf '%s\n' "$TITLE" | grep -qE '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: [^[:space:]]'; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title \"$TITLE\" is not a Conventional Commit (type[(scope)][!]: description)"
            exit 1
          fi
