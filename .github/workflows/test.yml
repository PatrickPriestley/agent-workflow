name: test

on:
  pull_request:
  push:
    branches: [main]
  # by hand, on any branch: the whole matrix, for a change that might behave differently on macOS
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces the run of the one before it. A run on main is never
# cancelled: each merge keeps its own result.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes are free for a public repository and about ten times a Linux minute for a
        # private one (record docs/changes/2026-11-14-ci-macos-cost.md). So a pull request to a
        # private repository runs on Linux alone; a push to main, a run started by hand and
        # anything on a public repository run on both.
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.repository.private && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Native evaluation context
        run: node --test evals/context.test.cjs
      - name: Installer
        run: bash install.test.sh
      - name: commit-gate
        run: bash bin/commit-gate.test.sh
      - name: agent-review
        run: bash bin/agent-review.test.sh
      - name: plan skill scripts
        run: for t in skills/plan/scripts/test-*.sh; do bash "$t"; done
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: PR-Agent config and review skill
        run: bash pr-agent/pr-agent.test.sh
      - name: PR-Agent trial scripts
        run: bash pr-agent/try.test.sh
      - name: PR-Agent workflow
        run: bash pr-agent/workflow.test.sh
      - name: PR-Agent image check
        run: bash pr-agent/verify-image.test.sh
      - name: pr-size
        run: bash bin/pr-size.test.sh
      - name: CI workflow
        run: bash bin/ci-workflow.test.sh
      - name: Open Code Review workflow
        run: bash bin/ocr-workflow.test.sh
      - name: red-check workflow
        run: bash bin/red-check-workflow.test.sh
      - name: Verify workflow
        run: bash bin/verify-workflow.test.sh
      - name: Agent allowlists
        run: bash bin/agent-allowlists.test.sh
      - name: probe-key
        run: bash bin/probe-key.test.sh
      - name: probe-score
        run: bash bin/probe-score.test.sh
      - name: probe-evidence
        run: bash bin/probe-evidence.test.sh
      - name: probe-score workflow
        run: bash bin/probe-score-workflow.test.sh
      - name: probe-open
        run: bash bin/probe-open.test.sh
      - name: probe-properties
        run: bash bin/probe-properties.test.sh
      - name: probe-store
        run: bash bin/probe-store.test.sh
      - name: probe-ready
        run: bash bin/probe-ready.test.sh
      - name: probe-score-auto workflow
        run: bash bin/probe-score-auto-workflow.test.sh
      - name: probe-report
        run: bash bin/probe-report.test.sh
      - name: probe-report workflow
        run: bash bin/probe-report-workflow.test.sh
      - name: agent-session-collect
        run: bash bin/agent-session-collect.test.sh
      - name: agent-sessions workflow
        run: bash bin/agent-sessions-workflow.test.sh
      - name: probe-plant workflow
        run: bash bin/probe-plant-workflow.test.sh
      - name: Property Scout workflow
        run: bash bin/property-scout-workflow.test.sh

  # A job of its own, so these suites run whatever happens in the job above, and a step per
  # suite that runs even after an earlier one failed, so one red suite does not hide the next.
  change-record:
    name: change-record (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes are free for a public repository and about ten times a Linux minute for a
        # private one (record docs/changes/2026-11-14-ci-macos-cost.md). So a pull request to a
        # private repository runs on Linux alone; a push to main, a run started by hand and
        # anything on a public repository run on both.
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.repository.private && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Versions
        run: bash --version | head -n1; python3 --version; git --version; node --version
      # judge --review runs a model's scripts in a bwrap box, and its tests do the same. A Linux
      # runner may have no bwrap, or forbid the user namespaces it needs. Where the box still
      # cannot start the step warns, and the suite tests the unboxed path only and says so.
      - name: A box for the review's scripts (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          command -v bwrap >/dev/null || sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          if bwrap --unshare-all --ro-bind / / true; then echo "a box can start here"
          else echo "::warning::no bwrap box can start on this runner: the boxed review tests are skipped"; fi
      # The store's schema is tested in a PostgreSQL the suite starts for itself. A Linux runner
      # has one installed or can install it; the suite must then run. On macOS it runs where one
      # is installed and says so where none is.
      - name: A PostgreSQL for the store's schema (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || { sudo apt-get update -q; sudo apt-get install -y -q postgresql; }
          echo "SCHEMA_TEST_REQUIRED=1" >> "$GITHUB_ENV"
      - name: red-check
        if: ${{ !cancelled() }}
        run: bash plugins/change-record/bin/red-check.test.sh
      - name: record-check
        if: ${{ !cancelled() }}
        run: bash plugins/change-record/bin/record-check.test.sh
      - name: dispatch
        if: ${{ !cancelled() }}
        run: bash plugins/change-record/bin/dispatch.test.sh
      - name: record-review
        if: ${{ !cancelled() }}
        run: bash plugins/change-record/bin/record-review.test.sh
      - name: transcripts
        if: ${{ !cancelled() }}
        run: bash plugins/change-record/bin/transcripts.test.sh
      - name: transcripts store
        if: ${{ !cancelled() }}
        run: bash plugins/change-record/bin/transcripts-store.test.sh
      - name: store schema
        if: ${{ !cancelled() }}
        run: bash plugins/change-record/store/schema.test.sh
      - name: transcripts grade
        if: ${{ !cancelled() }}
        run: bash plugins/change-record/bin/transcripts-grade.test.sh
      - name: transcripts judge
        if: ${{ !cancelled() }}
        run: bash plugins/change-record/bin/transcripts-judge.test.sh
      - name: transcripts compare
        if: ${{ !cancelled() }}
        run: bash plugins/change-record/bin/transcripts-compare.test.sh
      - name: eval cases
        if: ${{ !cancelled() }}
        run: node --test plugins/change-record/evals/cases.test.cjs
      - name: outcome evals, the checks
        if: ${{ !cancelled() }}
        run: bash plugins/change-record/outcome-evals/checks/selftest.sh
      - name: outcome evals, the harness
        if: ${{ !cancelled() }}
        run: bash plugins/change-record/outcome-evals/run.test.sh

  pr-size:
    name: pr size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Warns, never fails: some changes cannot be split (see feature-loop). Counts from the
      # merge base to the PR's own head commit, not GitHub's merge commit.
      - name: Reviewable lines added
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash bin/pr-size --github "$(git merge-base "$BASE_SHA" "$HEAD_SHA")..$HEAD_SHA"

  pr-title:
    name: conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Squash merges use the PR title as the commit subject, so it must pass the same rule
          # as commit-gate's commit-msg hook.
          if printf '%s\n' "$TITLE" | grep -qE '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: [^[:space:]]'; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title \"$TITLE\" is not a Conventional Commit (type[(scope)][!]: description)"
            exit 1
          fi
