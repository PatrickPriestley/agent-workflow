name: red-check

# Rule 2, red before green: each test file a pull request adds or changes must fail on
# its merge base. plugins/change-record/bin/red-check copies each such file into a
# worktree of the base and runs it there. red: it fails on an assertion, so it shows the
# change is needed. green: it passes without the change, so it proves nothing about it
# (expected when a pull request only adds tests for behaviour that already exists).
# inconclusive: it could not reach an assertion on the base.
#
# Report only for now: the verdicts go to the job summary and as annotations, and the
# job fails only when red-check itself cannot run (exit 2). Bash tests, node:test files
# and the Hegel properties in properties/ are checked.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: red-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  red-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Hegel, for properties/
        run: pip install 'hegeltest==0.5.1'
      - name: red-check the changed tests (report only)
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -u
          rc=plugins/change-record/bin/red-check
          range="$(git merge-base "origin/$BASE_REF" HEAD)..HEAD"
          out="$RUNNER_TEMP/red-check"; mkdir -p "$out"
          worst=0
          check() {  # name, then red-check's arguments
            local name="$1"; shift
            # GitHub runs this step with bash -e: catch the exit code on the same line, or a
            # verdict of 1 ends the step before it is reported.
            local code=0
            bash "$rc" "$range" "$@" --json > "$out/$name.json" 2> "$out/$name.err" || code=$?
            echo "$name: exit $code"
            # 0 and 1 are verdicts (1: a green file, or all inconclusive). Anything else,
            # or no JSON at all, means red-check did not run: a usage error (2), a crash,
            # a missing interpreter (126, 127) or a signal.
            if [ "$code" -gt 1 ] || ! jq -e . "$out/$name.json" >/dev/null 2>&1; then
              cat "$out/$name.err"; worst=2
            fi
            return 0
          }
          check bash --run 'bash {files}' --match '**/*.test.sh' --red-pattern '^[[:space:]]*FAIL[[:space:]]'
          check node --run 'node --test {files}' --match '**/*.test.cjs' --match '**/*.test.js'
          check properties --run 'python3 -I {files}' --match 'properties/*.py'
          {
            echo '## red-check'
            echo
            echo 'Each changed test file, run against the merge base. **red**: fails without the change, so it shows the change is needed. **green**: passes without it, which proves nothing about a behaviour change (and is expected when a pull request only adds tests for existing behaviour). **inconclusive**: could not reach an assertion on the base.'
            echo
            echo '| Kind | File | Verdict | Detail |'
            echo '|---|---|---|---|'
            for name in bash node properties; do
              # File names and details come from the pull request: no newline, carriage
              # return or table bar reaches the summary.
              jq -r --arg k "$name" 'def clean: gsub("[\\n\\r|`]"; " ");
                .files[]? | "| \($k) | `\(.file | clean)` | \(.verdict) | \(.detail | clean) |"' "$out/$name.json" 2>/dev/null
            done
            echo
            for name in bash node properties; do
              jq -r --arg k "$name" '"- \($k): \(.summary // "no result")"' "$out/$name.json" 2>/dev/null || echo "- $name: no result"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for name in bash node properties; do
            # A file name can hold a newline and "::error::": strip what could end the
            # annotation or start another (red-check does the same in its own output).
            jq -r '.files[]? | select(.verdict == "green") | "::warning file=\(.file | gsub("[\\n\\r,:]"; ""))::red-check: passes on the base commit, so it does not show this change is needed"' "$out/$name.json" 2>/dev/null
          done
          exit "$worst"
