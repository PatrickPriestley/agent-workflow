name: agent-sessions

# When a GitHub agent's run finishes, collect its Claude Code session into the transcript
# store (plugins/change-record/store), so `transcripts grade` and `judge` can read what the
# agent did, and the probe loop's improver can see why it missed (docs/plans/2026-11-24-probe-loop.md,
# Store, Phase 3).
#
# gh-aw keeps the agent's Claude output (stream-json) and prompt in the run's "agent"
# artifact. bin/agent-session-collect turns them into a transcript in Claude Code's layout;
# the change-record plugin's own transcripts tool archives it and pushes it, redacted, with the
# store's insert-only key. Nothing here runs code from the agent's run or its pull request: the
# artifact is data, read by main's tools.
#
# The planter ("Plant a probe") is left out: its session holds the answer key. So are agents
# on another engine (README drift check runs on Codex): their output has no Claude lines.
on:
  workflow_run:
    workflows: ["Verify PR claims", "CI diagnosis", "CI fix", "Property Scout"]
    types: [completed]
  workflow_call:  # other repositories: docs/reusable-workflows.md; the caller names its agents
    inputs:
      tools-repository:
        description: "Where the probe and transcript tools come from"
        type: string
        default: PatrickPriestley/agent-workflow
      tools-ref:
        description: "The tools' branch, tag or commit; pin it to the ref you call this workflow at"
        type: string
        default: main
    secrets:
      AGENT_TRANSCRIPTS_URL:
        required: false
      AGENT_TRANSCRIPTS_INSERT_KEY:
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: agent-sessions-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the tools, from main
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.tools-repository || 'PatrickPriestley/agent-workflow' }}
          ref: ${{ inputs.tools-ref || 'main' }}
          persist-credentials: false
      - name: Download the agent's output
        id: download
        continue-on-error: true  # a run whose agent never started has no artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent
          path: ${{ runner.temp }}/agent
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Collect the session and push it
        env:
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          DOWNLOADED: ${{ steps.download.outcome }}
          AGENT_TRANSCRIPTS_URL: ${{ secrets.AGENT_TRANSCRIPTS_URL }}
          INSERT_KEY: ${{ secrets.AGENT_TRANSCRIPTS_INSERT_KEY }}
        run: |
          set -u
          if [ "$DOWNLOADED" != success ]; then
            echo "::notice::run $RUN_ID of $WORKFLOW has no agent artifact: nothing to collect"; exit 0
          fi
          log="$(find "$RUNNER_TEMP/agent" -name agent-stdio.log -type f | head -1)"
          prompt="$(find "$RUNNER_TEMP/agent" -path '*/aw-prompts/prompt.txt' -type f | head -1)"
          if [ -z "$log" ] || [ -z "$prompt" ]; then
            echo "::notice::run $RUN_ID of $WORKFLOW kept no agent-stdio.log or prompt.txt: nothing to collect"; exit 0
          fi
          if [ -z "$AGENT_TRANSCRIPTS_URL" ] || [ -z "$INSERT_KEY" ]; then
            echo "::warning::the AGENT_TRANSCRIPTS_URL and AGENT_TRANSCRIPTS_INSERT_KEY secrets are not both set: nothing sent"; exit 0
          fi
          echo "::add-mask::$INSERT_KEY"
          export AGENT_TRANSCRIPTS="$RUNNER_TEMP/archive" XDG_CONFIG_HOME="$RUNNER_TEMP/config"
          mkdir -p "$XDG_CONFIG_HOME/agent-transcripts"
          (umask 077 && printf '%s\n' "$INSERT_KEY" > "$XDG_CONFIG_HOME/agent-transcripts/insert-key")
          code=0
          transcript="$(python3 -I bin/agent-session-collect "$log" --prompt "$prompt" --workflow "$WORKFLOW" \
            --run-id "$RUN_ID" --attempt "$ATTEMPT" --cwd "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/sessions")" || code=$?
          if [ "$code" -eq 1 ]; then echo "::notice::the agent said nothing: nothing to collect"; exit 0; fi
          [ "$code" -eq 0 ] || exit "$code"
          sid="$(basename "$transcript" .jsonl)"
          # archive never fails a session, by design; here a session it did not keep is an error.
          plugins/change-record/bin/transcripts archive --transcript "$transcript"
          [ -f "$AGENT_TRANSCRIPTS/sessions/$sid.json" ] || { echo "::error::$sid was not archived"; exit 1; }
          plugins/change-record/bin/transcripts push
          {
            echo "## Agent session"
            echo
            echo "Collected run $RUN_ID (attempt $ATTEMPT) of $WORKFLOW as \`$sid\`."
          } >> "$GITHUB_STEP_SUMMARY"
